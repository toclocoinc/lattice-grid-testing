name: Publish

# One tag, one publish: npm refuses to republish an existing version, so the
# trigger is a version tag, not every push. Authentication is npm trusted
# publishing (OIDC): the package on npmjs.com names this repository and this
# workflow as its publisher, and no token is stored anywhere.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.1.0'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; the runner's bundled npm can lag.
      - run: npm install -g npm@latest
      - run: npm ci --ignore-scripts
        env:
          CYPRESS_INSTALL_BINARY: '0'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node tools/build.js
      - run: node --test test/unit/*.test.js
      - name: The tag must match package.json
        run: |
          V=$(node -p "require('./package.json').version")
          T="${{ inputs.tag || github.ref_name }}"
          [ "v$V" = "$T" ] || { echo "package.json says $V, tag is $T"; exit 1; }
      - run: npm publish --access public --provenance
